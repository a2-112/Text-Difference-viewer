<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=ink_pen" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Text Difference Viewer</title>
  </head>
  <body>
    <header>
      <h1>Text Difference Viewer<span class="material-symbols-outlined">
ink_pen
</span></h1>
    </header>
    <main>
        <div class="text-area">
       <textarea id="first" placeholder="Enter the first text..."></textarea>
    <textarea id="second" placeholder="Enter the second text..."></textarea>
        </div>
      <button id="compare">Compare</button>

      <section class="results">
        <div class="text">
          <h2>Original Text Value</h2>
          <p id="original1"></p>
          <p id="original2"></p>
        </div>
         <div class="common">
            <h2>Common Text</h2>
            <p id="lcs-value"></p>
          </div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
